<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Panel del delegado · Privacidad 21.719</title>
<link rel="stylesheet" href="{{ BASE }}/estaticos/panel.css">
<script src="{{ BASE }}/estaticos/tema.js"></script>
</head>
<body>
<main class="ingreso">
<form class="tarjeta" method="post" action="{{ BASE }}/entrar">
<div class="marca">
<svg width="40" height="40" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="none" stroke="#3DD6C3" stroke-width="2"/><path d="M17 8 L25 11 V17 C25 22 21.5 25 17 26.5 C12.5 25 9 22 9 17 V11 Z" fill="none" stroke="#3DD6C3" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 17 L16 19.5 L20.5 14.5" fill="none" stroke="#3DD6C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span><strong>Privacidad 21.719</strong><span>Panel del delegado</span></span>
</div>
<h1>Entrar</h1>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
{% if aviso %}<div class="aviso" role="status">{{ aviso }}</div>{% endif %}
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="campo"><label for="usuario">Usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
<div class="campo"><label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required></div>
<button class="primario" type="submit">Entrar</button>
<p class="suave">La sesión se cierra sola tras 30 minutos sin uso.</p>
</form>
</main>
</body>
</html>
