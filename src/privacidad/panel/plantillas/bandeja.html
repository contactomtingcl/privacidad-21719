{% extends "base.html" %}
{% block titulo %}Bandeja{% endblock %}
{% block cuerpo %}
<header class="cabecera">
<div>
<p class="suave">{{ ahora | fecha }} · {{ ctx.org.nombre }}</p>
<h1>{% if filtro == "validados" %}Casos validados{% else %}Bandeja{% endif %}</h1>
</div>
<div class="acciones">
<button type="button" class="icono" data-cambiar-tema aria-label="Cambiar a tema claro">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<a class="boton" href="{{ BASE }}/evidencia">Revisar evidencia</a>
</div>
</header>
{% include "_bandeja_contenido.html" %}
{% endblock %}
