[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "privacidad-21719"
version = "0.1.0"
description = "Cumplimiento operativo de la Ley 21.719 para empresas medianas y municipios."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Matías Ignacio Navarro Arroyo" }]
dependencies = [
  "pydantic>=2.7,<3",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "cryptography>=42",
  "tzdata>=2024.1",
  "segno>=1.6",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "babel>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ia = ["anthropic>=0.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"privacidad.canal" = ["plantillas/*.html"]
"privacidad.iconos" = ["svg/*.svg", "svg/*.txt"]
"privacidad.panel" = ["plantillas/*.html", "estaticos/*.css", "estaticos/*.js", "estaticos/*.txt", "estaticos/fuentes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
