# Categorías de datos personales que reconoce el inventario.
#
# - palabras: términos que, en el encabezado de una columna, indican la categoría.
#   Se comparan sin tildes ni mayúsculas, como palabras o frases completas.
# - sensible: true (dato sensible por definición legal), false, o "revisar" cuando
#   depende del contexto y debe decidirlo una persona.
# - especial: categorías con reglas propias en la ley ("financiero", "menores").
# - fundamento: cita al texto legal. Las pruebas verifican que cada fragmento
#   aparece literalmente en el artículo citado del corpus.

version: 1

