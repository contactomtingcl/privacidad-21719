# Set etiquetado: mensajes de titulares que llegan por el canal (50 casos). Todo es ficticio.
#
# - es_solicitud: si el mensaje ejerce un derecho del art. 4 de la Ley 19.628.
# - derechos: interpretación principal (acceso, rectificacion, supresion, oposicion,
#   portabilidad, bloqueo).
# - alternativas: otras lecturas razonables del mismo mensaje; también se aceptan.
# - requiere_confirmacion: el mensaje admite lecturas con respuestas distintas, o le falta
#   lo que exige el art. 11 (qué datos o qué tratamiento, la causal o la corrección precisa).
#   El sistema debe preguntarle al titular qué quiso decir; el plazo corre igual.
# - vence_respuesta y vence_bloqueo: plazos del art. 11 calculados a mano
#   (30 días corridos; 2 días hábiles sin fines de semana ni feriados).
version: 1
etiquetado_por: Etiquetas redactadas con asistencia de IA (Claude) a partir del texto legal citado. Pendientes de revisión del autor y de un abogado.

