      - {nombre: "RUT", esperado: persona_juridica, trampa: true, nota: RUT de la empresa cliente, no de una persona, valores: ["50.523.645-9", "50.628.374-4", "50.733.103-3"]}
      - {nombre: "Contacto", esperado: nombre, valores: ["Rodrigo Álvarez Cid", "Macarena Gutiérrez Ríos", "Esteban Carrasco Lillo"]}
      - {nombre: "Producto", categorica: true, esperado: no_personal, valores: ["Taladro", "Martillo", "Cemento 25 kg", "Taladro", "Clavos 2 pulgadas"]}
      - {nombre: "Precio unitario", categorica: true, esperado: no_personal, valores: ["45990", "8990", "5490", "45990", "1990"]}
      - {nombre: "Bodega", categorica: true, esperado: no_personal, valores: ["Bodega 1", "Bodega 2", "Bodega 1", "Bodega 3"]}
