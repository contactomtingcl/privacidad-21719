  - id: col-e
    descripcion: Control de asistencia de trabajadores con reloj biométrico y aplicación móvil, y encuesta interna de diversidad.
    columnas:
      - {nombre: "Trabajador", esperado: nombre, valores: ["Valentina Morales Paz", "Cristóbal Fuentes Ortiz", "Isidora Rojas Vidal"]}
      - {nombre: "Huella (plantilla)", esperado: biometrico, valores: ["a8f3c91e07b2", "4be27d10c9aa", "f01c9e3b7a65"]}
      - {nombre: "Hora entrada", esperado: laboral, valores: ["08:02", "07:58", "08:15", "08:00"]}
      - {nombre: "Coordenadas marcaje", esperado: geolocalizacion, valores: ["-37.0331,-72.4012", "-37.0329,-72.4008", "-37.0335,-72.4010"]}
      - {nombre: "Foto marcaje", esperado: imagen, valores: ["img_0001.jpg", "img_0002.jpg", "img_0003.jpg"]}
      - {nombre: "Turno", categorica: true, esperado: laboral, valores: ["Mañana", "Tarde", "Mañana", "Noche"]}
