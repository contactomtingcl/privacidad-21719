# Set etiquetado: columnas de planillas (50 casos en 5 planillas).
# Todos los valores son ficticios. "esperado" es una clave del catálogo
# (data/categorias.yaml), "no_personal" o "persona_juridica".
# Las columnas con "categorica: true" tienen pocos valores distintos que se repiten
# en muchas filas; la evaluación las replica a 30 filas.
# Las columnas marcadas como "trampa" tienen un encabezado que engaña a una regla
# por palabras clave (por ejemplo, "Raza" de una mascota no es origen étnico).
version: 1
etiquetado_por: Etiquetas redactadas con asistencia de IA (Claude) a partir del texto legal citado. Pendientes de revisión del autor y de un abogado.

planillas:
  - id: col-a
    descripcion: Inscripción de los hijos e hijas de los trabajadores en un taller deportivo de verano.
    columnas:
      - {nombre: "Nombre niño/a", esperado: nombre, valores: ["Tomás Rojas Díaz", "Emilia Soto Pérez", "Agustín Muñoz Silva", "Josefa Tapia Castro", "Lucas Reyes Flores"]}
      - {nombre: "Obs.", categorica: true, esperado: salud, nota: Observaciones con enfermedades, valores: ["Asma", "Ninguna", "Ninguna", "Usa inhalador", "Ninguna", "Diabetes tipo 1", "Ninguna"]}
      - {nombre: "Dieta", categorica: true, esperado: salud, nota: Celiaquía e intolerancias son datos de salud, valores: ["Normal", "Sin gluten (celíaco)", "Normal", "Sin lactosa", "Normal", "Normal"]}
      - {nombre: "Seguro", categorica: true, esperado: prevision_salud, valores: ["Fonasa", "Isapre", "Fonasa", "Fonasa", "Isapre"]}
      - {nombre: "F. nac.", esperado: fecha_nacimiento, valores: ["03/05/2016", "21/11/2017", "14/02/2015", "30/08/2018", "09/01/2016"]}
      - {nombre: "Quién retira", categorica: true, esperado: parentesco, valores: ["Abuela", "Madre", "Padre", "Tío", "Madre", "Padre"]}
      - {nombre: "Contacto emergencia", esperado: telefono, valores: ["+56 9 0000 0101", "+56 9 0000 0102", "+56 9 0000 0103", "+56 9 0000 0104"]}
      - {nombre: "Comuna", categorica: true, esperado: direccion, valores: ["Cabrero", "Los Ángeles", "Yumbel", "Cabrero", "Laja"]}
      - {nombre: "Pertenece a pueblo originario", categorica: true, esperado: origen_etnico, valores: ["No", "Sí", "No", "No", "No", "No"]}
      - {nombre: "Monto pagado", categorica: true, esperado: financiero, valores: ["15000", "15000", "0", "15000", "7500"]}

  - id: col-b
    descripcion: Base de clientes de una veterinaria y tienda de mascotas, usada para agendar controles y enviar ofertas.
    columnas:
      - {nombre: "Cliente", esperado: nombre, valores: ["Camila Fuentes Araya", "Diego Torres Vega", "Paula Castillo Reyes", "Martín Pizarro Soto"]}
      - {nombre: "Mail", esperado: correo, valores: ["camila.fuentes@clientes.example", "diego.torres@clientes.example", "paula.c@clientes.example"]}
      - {nombre: "Fono", esperado: telefono, valores: ["+56 9 0000 0105", "+56 9 0000 0106", "+56 9 0000 0107"]}
      - {nombre: "Raza", categorica: true, esperado: no_personal, trampa: true, nota: Raza de la mascota, no de la persona, valores: ["Labrador", "Poodle", "Quiltro", "Pastor alemán", "Quiltro", "Beagle"]}
      - {nombre: "Nombre mascota", categorica: true, esperado: no_personal, trampa: true, valores: ["Toby", "Luna", "Canela", "Rocky", "Mía"]}
      - {nombre: "Deuda pendiente", categorica: true, esperado: financiero, valores: ["0", "12500", "0", "38000", "0"]}
      - {nombre: "Última visita", esperado: preferencias_comerciales, nota: Historial de servicios del cliente, valores: ["2026-09-14", "2026-10-02", "2026-07-30", "2026-08-21"]}
      - {nombre: "Acepta ofertas", categorica: true, esperado: preferencias_comerciales, valores: ["Sí", "No", "Sí", "Sí", "No", "Sí"]}
      - {nombre: "Diagnóstico", categorica: true, esperado: no_personal, trampa: true, nota: Diagnóstico de la mascota, no de la persona, valores: ["Otitis", "Control sano", "Sarna", "Control sano", "Vacuna anual"]}
      - {nombre: "Dirección despacho", esperado: direccion, valores: ["Los Aromos 123", "Pasaje El Roble 45", "Av. Principal 900"]}

  - id: col-c
    descripcion: Registro de postulantes a cargos de vendedor y bodeguero.
    columnas:
      - {nombre: "R.U.N.", esperado: identificador_nacional, valores: ["50.104.729-5", "50.209.458-0", "50.314.187-6", "50.418.916-3"]}
      - {nombre: "Postulante", esperado: nombre, valores: ["Fernanda Vásquez Mora", "Ignacio Sepúlveda Lagos", "Bárbara Contreras Paz"]}
      - {nombre: "Pretensión de renta", esperado: financiero, valores: ["850000", "700000", "1100000", "650000"]}
      - {nombre: "Discapacidad (Ley 21.015)", categorica: true, esperado: salud, valores: ["No", "No", "Sí", "No", "No", "No"]}
      - {nombre: "Hijos", categorica: true, esperado: parentesco, valores: ["2", "0", "1", "0", "3"]}
      - {nombre: "Sindicalizado en trabajo anterior", categorica: true, esperado: afiliacion_sindical, valores: ["Sí", "No", "No", "Sí", "No"]}
      - {nombre: "Fecha nacimiento", esperado: fecha_nacimiento, valores: ["12/03/1990", "28/07/1985", "05/11/1998"]}
      - {nombre: "Cargo al que postula", categorica: true, esperado: laboral, valores: ["Vendedor", "Bodeguero", "Vendedor", "Vendedor"]}
      - {nombre: "Antecedentes médicos", categorica: true, esperado: salud, valores: ["Operado de rodilla en 2020", "Ninguno", "Hipertensión controlada", "Ninguno"]}
      - {nombre: "Militancia", categorica: true, esperado: afiliacion_politica, valores: ["No", "No", "Sí", "No", "No"]}

  - id: col-d
    descripcion: Registro de ventas y despachos a empresas clientes de una ferretería mayorista.
    columnas:
