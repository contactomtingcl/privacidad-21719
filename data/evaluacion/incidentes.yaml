# Set etiquetado: reportes de incidentes (50 casos). Todo es ficticio.
#
# Cada caso tiene el texto tal como lo escribiría alguien de la organización, el perfil
# de la organización (lo configura la organización, no lo adivina la IA), los hechos
# esperados y los deberes esperados según el art. 14 sexies de la Ley 19.628 y los
# arts. 4, 9 y 27 de la Ley 21.663.
#
# "revisar" significa que la ley exige una ponderación que debe hacer una persona
# (por ejemplo, si existe "riesgo razonable"). Las pruebas comprueban que los
# deberes esperados coinciden con lo que decide el motor a partir de los hechos esperados.
version: 1
etiquetado_por: Etiquetas redactadas con asistencia de IA (Claude) a partir del texto legal citado. Pendientes de revisión del autor y de un abogado.

casos:
