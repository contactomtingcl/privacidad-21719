    hechos: {datos_personales: true, vulneracion: acceso_no_autorizado, categorias_especiales: [], riesgo_mitigado: false, ciberincidente: "si"}
    esperado: {aviso_agencia: "si", aviso_titulares: "no", reporte_anci: "no"}

