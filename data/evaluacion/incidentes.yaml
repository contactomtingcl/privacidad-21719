    perfil: empresa_privada
    texto: >-
      Hola, ayer en la tarde le mandé por error al proveedor de transporte la planilla de
      clientes con deudas atrasadas (nombre, RUT, monto que deben y días de mora). Eran como
      350 clientes. Ya le pedí que la borre pero no me ha contestado.
    hechos: {datos_personales: true, vulneracion: comunicacion_no_autorizada, categorias_especiales: [financieros], riesgo_mitigado: false, ciberincidente: "no"}
    esperado: {aviso_agencia: "si", aviso_titulares: "si", reporte_anci: "no"}

