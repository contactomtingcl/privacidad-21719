# Feriados nacionales de Chile para contar días hábiles (lunes a viernes que no son feriado).
#
# Verificado el 17-10-2026 para 2026 y 2027 (`cubre_desde` a `cubre_hasta`):
# - Las reglas que mueven fechas se leyeron en fuentes oficiales: el traslado a lunes de San Pedro
#   y San Pablo y del 12 de octubre (Ley 19.668, Dirección del Trabajo) y el feriado del viernes
#   17 de septiembre cuando el 18 y el 19 caen sábado y domingo (Ley 20.983, Diario Oficial).
# - La lista completa se cotejó con calendarios que citan la ley de cada feriado: 2026 con
#   feriados.cl (fuente BCN) y Meganoticias (16 feriados, coinciden todos); 2027 con Buk y Laborix
#   (17 feriados, coinciden todos).
# - No se pudo abrir gob.cl desde el entorno de desarrollo.
#
# Fuera de este rango, o si se agrega un feriado por ley nueva o por elecciones, el motor marca
# los plazos en días hábiles como «a confirmar». No incluye feriados regionales (7 de junio en
# Arica y Parinacota; 20 de agosto en Chillán y Chillán Viejo): las organizaciones del piloto no
# están en esas comunas.
verificado: true
cubre_desde: 2026-01-01
cubre_hasta: 2027-12-31
fuentes:
  - "Dirección del Trabajo, traslado de feriados (Ley 19.668): https://dt.gob.cl/portal/1628/w3-article-60252.html"
  - "Diario Oficial, Ley 20.983 (30-12-2016): https://www.diariooficial.interior.gob.cl/publicaciones/2016/12/30/41646/01/1161478.pdf"
  - "feriados.cl, 2026 (cita la BCN): https://www.feriados.cl/"
  - "Meganoticias, feriados 2026: https://www.meganoticias.cl/dato-util/509846-feriados-2026-chile-cuales-son-1ab-dcv-22-12-2025.html"
  - "Buk, feriados 2027: https://www.buk.cl/blog/cuantos-feriados-tendra-chile"
  - "Laborix, feriados 2027: https://laborix.cl/feriados-chile-2027"
