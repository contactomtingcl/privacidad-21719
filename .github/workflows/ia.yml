name: IA

# Se ejecuta a mano desde la pestaña Actions. Usa el secreto ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      tarea:
        description: "Qué ejecutar"
        required: true
        default: ia.prueba_conexion
        type: choice
        options: [ia.prueba_conexion, inventario.demo_ia, evaluacion]

permissions:
  contents: write

jobs:
  ia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install -e ".[ia]"
      - name: Ejecutar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAREA: ${{ inputs.tarea }}
        run: python -m "privacidad.$TAREA"
      - name: Guardar resultados en el repositorio
        if: ${{ hashFiles('resultados/**') != '' }}
        env:
          TAREA: ${{ inputs.tarea }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados
          git diff --cached --quiet || git commit -m "Resultados: $TAREA [skip ci]"
          git push
